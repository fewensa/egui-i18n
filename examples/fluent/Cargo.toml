[package]
name = "egui-i18n-example-fluent"
version.workspace = true
authors.workspace = true
description = "Example egui application using the egui-i18n Fluent backend"
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
rust-version = "1.95"

[dependencies]
eframe = "0.37.0"

egui-i18n = { workspace = true, features = ["fluent"] }

# For image support:
egui_extras = { version = "0.37.0", features = ["default", "image"] }
env_logger = { version = "0.11.11", default-features = false, features = [
  "auto-color",
  "humantime",
] }
